# Gradle memory
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# MC 26.3 requires Java 25 to run Gradle/Loom; point the Gradle daemon at a JDK 25.
# (Downloaded to C:\Users\admin\.jdks\microsoft-jdk-25)
org.gradle.java.home=C:/Users/admin/.jdks/microsoft-jdk-25/jdk-25.0.4.1+1

# Fabric Properties (see https://fabricmc.net/develop for the current values)
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.3
maven_group=com.flashbackinventory
archives_base_name=flashback-inventory

# Dependencies
fabric_version=0.161.0+26.2

# Flashback (compile-only dependency so we can access its addon API)
# Maven coordinate on the Modrinth maven: maven.modrinth:<projectId>:<versionId>
# projectId = 4das1Fjq (Flashback), versionId = Um7qd3Na (0.43.6 for MC 26.2)
flashback_modrinth_version=Um7qd3Na

# Mod Menu (compile-only; users install Mod Menu at runtime) - MC 26.2, Fabric.
modmenu_version=20.0.3
