plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Modrinth maven: used for compile-only access to the Flashback addon API.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	mavenCentral()
}

loom {
	mods {
		"flashback_inventory" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file.
	// (No `mappings` line: Loom 1.17+ applies Mojang mappings automatically for MC 26.3.)
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Flashback - compile-only mod dependency on the Flashback addon API.
	// Downloaded manually (192 MB) into libs/ because Modrinth maven is too slow;
	// drop the jar at libs/Flashback-0.43.6-for-MC26.2.jar before building.
	compileOnly files("libs/Flashback-0.43.6-for-MC26.2.jar")

	// MC 26.2 ships LWJGL-GLFW (unlike 26.3 which uses SDL), so GLFW is available on the
	// compile classpath already; the keyboard helper (util/KeyboardUtil) uses it directly.

	// Mod Menu - compile-only so we can expose a config screen. Users install Mod Menu themselves.
	compileOnly "maven.modrinth:mOgUt4GM:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	toolchain.languageVersion.set(JavaLanguageVersion.of(25))
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
